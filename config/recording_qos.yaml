# Accept either reliable or best-effort sensor publishers.
/livox/lidar:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 100
/livox/imu:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 1000
/camera/camera/color/image_raw:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 30
/camera/camera/color/camera_info:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 30
/camera/camera/depth/image_rect_raw:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 30
/camera/camera/depth/camera_info:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 30
/camera/camera/imu:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 1000
/tf:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 100
# Retrieve transforms published before the recorder starts.
/tf_static:
  reliability: reliable
  durability: transient_local
  history: keep_all
